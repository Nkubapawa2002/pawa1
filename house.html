<!doctype html>
<html lang="en">
<head>
  <script src="js/core/theme.js"></script>
  <script src="js/core/viewport.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Property — Pawa Houses</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#070C0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-maskable.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/premium.css" />
  <link rel="stylesheet" href="css/claude-design.css" />
  <link rel="stylesheet" href="css/houses-pro.css" />
  <link rel="stylesheet" href="css/neon-pro.css" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/theme-light.css" />
  <!-- LAST on purpose. This screen's entire skin lives here, in design-system
       tokens, scoped to body[data-page="house"] so nothing above can outrank
       it. The ~460 lines of inline <style> and the hand-written "Twilight"
       palette of raw hexes that used to sit in this <head> are gone; the file
       header says why that mattered. -->
  <link rel="stylesheet" href="css/house-detail.css" />
  <!-- Adaptive layer: safe areas, the real viewport height, density,
       and the app/web shell switch. Loads last so it can correct the sheets
       above it. Pairs with js/core/viewport.js. -->
  <link rel="stylesheet" href="css/adaptive.css" />
</head>
<body data-houses-pro data-page="house">
  <a href="#hdBody" class="hp-skip-link">Skip to property details</a>
  <div id="nav-slot"></div>

  <!-- Persistent top bar. Back, save and share used to float over the photo and
       scroll away with it, so on a page this long the two actions a reader
       takes most often were reachable only from the very top. The listing's
       name fades in here once the hero title has scrolled past, so the bar
       never repeats a heading that is already on screen. -->
  <header class="hx-topbar" id="hxTopbar">
    <a href="houses.html" class="hx-topbar__back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      <span>Back</span>
    </a>
    <span class="hx-topbar__title" id="hxTopTitle" aria-hidden="true"></span>
    <button type="button" id="hdFavBtn" class="hx-iconbtn" hidden
            aria-label="Save to favourites" title="Save to favourites">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </button>
    <button type="button" id="hdShareBtn" class="hx-iconbtn" hidden
            aria-label="Share this listing" title="Share">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </button>
  </header>

  <main class="hd-wrap">
    <div id="hdBody" aria-live="polite" aria-busy="true">
      <div class="hp-sk-detail" aria-hidden="true">
        <div class="hp-sk-detail__hero"></div>
        <div class="hp-sk-detail__panel">
          <span class="hp-sk hp-sk--title"></span>
          <span class="hp-sk hp-sk--line" style="width:40%"></span>
          <span class="hp-sk hp-sk--price"></span>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px">
            <span class="hp-sk" style="height:60px;border-radius:12px"></span>
            <span class="hp-sk" style="height:60px;border-radius:12px"></span>
            <span class="hp-sk" style="height:60px;border-radius:12px"></span>
          </div>
        </div>
        <div class="hp-sk-detail__panel">
          <span class="hp-sk hp-sk--line" style="width:30%"></span>
          <span class="hp-sk hp-sk--line"></span>
          <span class="hp-sk hp-sk--line" style="width:85%"></span>
          <span class="hp-sk hp-sk--line" style="width:60%"></span>
        </div>
      </div>
    </div>
  </main>

  <!-- Sticky action bar. Below 1024px this IS the contact row — the in-page one
       is hidden there — so the encrypted door has to be here too, or it exists
       only for people on a desktop, which is not who is looking for a room in
       Mbezi. -->
  <div id="hdSticky" class="hd-sticky" hidden>
    <div class="hd-sticky-inner">
      <a id="hdStickyMsg"  class="hd-cta hd-cta-msg-sticky" href="#" hidden
         aria-label="Message the agent, encrypted" data-i18n-aria-label="hd_sticky_msg_aria"
         data-i18n="pm_reach">Message</a>
      <a id="hdStickyCall" class="hd-cta hd-cta-call" href="#" aria-label="Call agent">Call</a>
      <a id="hdStickyWa"   class="hd-cta hd-cta-wa"   href="#" target="_blank" rel="noopener" aria-label="WhatsApp agent">WhatsApp</a>
      <a id="hdStickyMeet" class="hd-cta hd-cta-meet" href="#" target="_blank" rel="noopener" aria-label="Request live viewing">Viewing</a>
    </div>
  </div>

  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="js/core/config.js"></script>
  <!-- The Mapbox token, which cannot live in a tracked file. Gitignored,
       so it 404s harmlessly on a deploy that does not ship it, leaving the
       MapTiler key from config.js to carry the map. -->
  <script src="js/config.local.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/data.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/nav.js"></script>
  <script src="js/lib/map-expand.js"></script>
  <!-- The local gazetteer + the matcher that reads a typed place name. This
       page's commute box ("how far is this home from your workplace?") used to
       load NEITHER, so it had no answer for anything LocationIQ could not
       geocode — including a university with 8,000 students whose coordinates
       were sitting in tz-places.js the whole time. Load order matters only in
       that both must precede house-place.js; geo.js picks them up at call time. -->
  <script src="js/lib/tz-places.js"></script>
  <script src="js/lib/place-match.js"></script>
  <script src="js/lib/geo.js"></script>
  <script src="js/lib/geolocate.js"></script>
  <!-- The spec sheet the agent wrote themselves: the room-by-room price table
       and the titled fact groups. agent-houses.js writes it, house.js draws
       it, and both of them get its shape from here. -->
  <script src="js/lib/house-spec.js"></script>
  <!-- "Which space, and what does IT cost?" — the room picker, the per-room
       specification tiles and the itemised move-in total. Reads the shape from
       house-spec.js above, so it loads after it. -->
  <script src="js/lib/house-rooms.js"></script>
  <!-- The encrypted door to whoever posted this listing. One link, but the
       decisions around it (the URL shape, the guard, the wording) live in
       one place so all four catalogues offer the same thing. -->
  <script src="js/lib/pm-reach.js"></script>

  <!-- The property screen itself, in four files. THE ORDER IS LOAD-BEARING:
       house-ui.js publishes esc/ico/ICO, and house-place.js calls ico() while
       building its category table at parse time, so ui must already have run.
       house.js comes last because the inline script below calls into it. -->
  <!-- Reads the money house-rooms.js works out and draws where it goes. -->
  <script src="js/lib/house-cost-chart.js"></script>
  <script src="js/lib/house-ui.js"></script>
  <script src="js/lib/house-sections.js"></script>
  <script src="js/lib/house-area.js"></script>
  <script src="js/lib/house-place.js"></script>
  <script src="js/pages/house.js"></script>
  <script>
    // Pure app-shell: native pushed-detail view — no top nav / footer / tab bar
    // here, just the top bar + the sticky CTA. js/pages/house.js renders the body.
    window.applyTranslations();
    window.initHousePage();
  </script>

  <script src="js/core/sw-register.js"></script>
  <script src="js/core/premium.js" defer></script>
</body>
</html>
