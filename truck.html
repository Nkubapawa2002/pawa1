<!doctype html>
<html lang="en">
<head>
  <script src="js/core/theme.js"></script>
  <script src="js/core/viewport.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Moving truck · Pawa</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9/dist/leaflet.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a6f4d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-maskable.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/premium.css" />
  <link rel="stylesheet" href="css/claude-design.css" />
  <link rel="stylesheet" href="css/houses-pro.css" />
  <link rel="stylesheet" href="css/neon-pro.css" />
  <link rel="stylesheet" href="css/design-system.css" />
  <!-- The read side of the listing form's characteristics list: the .of-list
       blocks at the foot of the sheet. js/lib/offer-spec.js turns the stored
       keys and the owner's own words into the same kind of line. -->
  <link rel="stylesheet" href="css/pick-list.css" />
  <link rel="stylesheet" href="css/theme-light.css" />
  <!-- The move planner and the match card, shared with house.html and
       trucks.html. -->
  <link rel="stylesheet" href="css/truck-move.css" />
  <!-- LAST on purpose: this sheet's whole skin, in design-system tokens,
       scoped to body[data-page="truck"]. Its header says why the theme guard
       sits on the paint and not on the layout. -->
  <link rel="stylesheet" href="css/truck-detail.css" />
  <!-- Adaptive layer: safe areas, the real viewport height, density,
       and the app/web shell switch. Loads last so it can correct the sheets
       above it. Pairs with js/core/viewport.js. -->
  <link rel="stylesheet" href="css/adaptive.css" />
</head>
<body data-houses-pro data-page="truck">
  <div id="nav-slot"></div>

  <main class="td-wrap tm">
    <a href="trucks.html" class="td-back" id="tdBack">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span data-i18n="truck_back">Back to trucks</span>
    </a>
    <div id="tdBody" aria-live="polite" aria-busy="true">
      <div class="td-panel" data-i18n="of_loading">Loading…</div>
    </div>
  </main>

  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9/dist/leaflet.js"></script>
  <script src="js/core/config.js"></script>
  <!-- The Mapbox token, which cannot live in a tracked file. Gitignored,
       so it 404s harmlessly on a deploy that does not ship it, leaving the
       MapTiler key from config.js to carry the map. -->
  <script src="js/config.local.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/data.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/nav.js"></script>
  <!-- Real road distances, so "how far is this lorry" is a drive and not a
       straight line. geolocate.js before maps-handoff.js: the hand-off reads
       the fix that file remembers. -->
  <script src="js/lib/geo.js"></script>
  <script src="js/lib/geolocate.js"></script>
  <script src="js/lib/maps-handoff.js"></script>
  <!-- The encrypted door to whoever posted this listing. One link, but the
       decisions around it (the URL shape, the guard, the wording) live in
       one place so all four catalogues offer the same thing. -->
  <script src="js/lib/pm-reach.js"></script>
  <!-- The one place a stored kind becomes a word a person reads.
       Three page scripts used to carry their own copy of that map. -->
  <script src="js/lib/listing-kinds.js"></script>
  <!-- The catalogue behind "what comes with it". -->
  <script src="js/lib/offer-spec.js"></script>
  <!-- The match engine and the shared card, so this sheet can answer the one
       question a reader actually has: will THIS lorry do MY move? -->
  <script src="js/lib/truck-match.js"></script>
  <script src="js/lib/truck-move-ui.js"></script>
  <script src="js/pages/truck.js"></script>
  <script>
    // Pure app-shell: native pushed-detail view — no top nav / footer / tab bar,
    // just the back button + inline CTAs. js/pages/truck.js renders the body.
    window.applyTranslations();
    window.initTruckPage();
  </script>

  <script src="js/core/sw-register.js"></script>
  <script src="js/core/premium.js" defer></script>
</body>
</html>
