<!doctype html>
<html lang="en">
<head>
  <script src="js/core/theme.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Daily services near you — Pawa</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9/dist/leaflet.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a6f4d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-maskable.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/premium.css" />
  <link rel="stylesheet" href="css/claude-design.css" />
  <link rel="stylesheet" href="css/houses-pro.css" />
  <link rel="stylesheet" href="css/neon-pro.css" />
  <link rel="stylesheet" href="css/design-system.css" />

  <style>
    .svc-toolbar {
      background: var(--c-surface, #fff); border: 1px solid var(--c-border, #e7e4dd);
      border-radius: 14px; padding: 12px; margin-bottom: 14px;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;
    }
    .svc-toolbar select, .svc-toolbar input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--c-border, #e7e4dd);
      border-radius: 10px; font-size: 16px; font-family: inherit; background: #fff; color: var(--c-text, #1a1915);
    }
    .svc-actions { display: flex; gap: 8px; grid-column: 1 / -1; flex-wrap: wrap; }
    .svc-near-me {
      display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border: none;
      border-radius: 10px; cursor: pointer; background: var(--c-brand, #0a6f4d); color: #fff; font-weight: 700; font-size: .9rem;
    }
    .svc-near-me svg { width: 18px; height: 18px; }
    .svc-near-me:disabled { opacity: .6; cursor: default; }
    .svc-list-cta {
      margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px;
      border-radius: 10px; font-weight: 700; font-size: .9rem; background: var(--c-accent, #bc5c00); color: #fff; text-decoration: none;
    }
    .svc-result-count { font-size: .9rem; color: var(--c-muted, #6b6960); margin: 6px 2px 10px; }
    .svc-mobile-tabs { display: none; gap: 8px; margin-bottom: 10px; }
    .svc-mobile-tabs button {
      flex: 1; padding: 10px; border: 1px solid var(--c-border, #e7e4dd); background: #fff;
      border-radius: 10px; font-weight: 700; cursor: pointer; color: var(--c-text,#1a1915);
    }
    .svc-mobile-tabs button.active { background: var(--c-brand, #0a6f4d); color: #fff; border-color: transparent; }
    .svc-stage { display: grid; grid-template-columns: 1.15fr .85fr; gap: 14px; align-items: start; }
    .svc-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .svc-map-wrap { position: sticky; top: 14px; }
    .svc-map { height: 72vh; min-height: 420px; border-radius: 14px; overflow: hidden; border: 1px solid var(--c-border, #e7e4dd); }

    /* Category chip rail — one-tap filtering */
    .svc-chips {
      display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .svc-chips::-webkit-scrollbar { display: none; }
    .svc-chip {
      flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--c-border, #e7e4dd); background: var(--c-surface, #fff);
      color: var(--c-text, #1a1915); font-weight: 700; font-size: .85rem; white-space: nowrap;
      transition: background .12s ease, color .12s ease, transform .12s ease;
    }
    .svc-chip:hover { transform: translateY(-1px); }
    .svc-chip.active { background: var(--c-brand, #0a6f4d); color: #fff; border-color: transparent; }

    .svc-card {
      background: var(--c-surface, #fff); border: 1px solid var(--c-border, #e7e4dd);
      border-radius: 14px; overflow: hidden;
      color: var(--c-text, #1a1915);
      display: flex; flex-direction: column; transition: transform .12s ease, box-shadow .12s ease;
    }
    /* ── The card is a row, not a tower ───────────────────────────────────
       The photo was a full-width 4:3 box: 268px of image area on a 358px phone
       card, and most listings carry no photo, so that was 268px of empty
       coloured block each. It is a thumbnail beside the words now, the same
       shape houses.html and explore.html use, so the catalogues look like one
       product and a photoless card is the height of its own text. */
    .svc-card-link {
      display: grid; grid-template-columns: 120px 1fr; gap: 0;
      text-decoration: none; color: inherit; cursor: pointer; flex: 1;
    }
    @media (max-width: 430px) { .svc-card-link { grid-template-columns: 104px 1fr; } }
    .svc-card-title { color: var(--c-text, #1a1915); }
    .svc-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,.12); }

    /* Quick actions: Call / WhatsApp / draw the real road Route */
    .svc-card-actions {
      display: flex; gap: 6px; padding: 0 11px 12px; margin-top: auto;
    }
    .sca-btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      padding: 8px 6px; border-radius: 9px; font-weight: 700; font-size: .76rem;
      text-decoration: none; border: none; cursor: pointer; white-space: nowrap;
      transition: filter .12s ease;
    }
    .sca-btn:hover { filter: brightness(1.08); }
    .sca-btn.call  { background: var(--c-brand, #0a6f4d); color: #fff; }
    .sca-btn.wa    { background: #1fa855; color: #fff; }
    .sca-btn.route { background: var(--c-surface-2, #f3f1ea); color: var(--c-text, #1a1915); border: 1px solid var(--c-border, #e7e4dd); }
    .svc-card-photo {
      position: relative; background: #eceae4 center/cover no-repeat;
      min-height: 100%; display: grid; place-items: center;
    }
    .svc-card-photo .sc-ph { width: 30px; height: 30px; opacity: .5; }
    .svc-card-badges { position: absolute; top: 8px; left: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
    .sc-badge { font-size: .68rem; font-weight: 800; letter-spacing: .3px; padding: 3px 8px; border-radius: 999px; color: #fff; background: rgba(0,0,0,.55); backdrop-filter: blur(3px); }
    .sc-badge.verified { background: var(--c-success, #0d8050); }
    .sc-badge.dist { background: rgba(0,0,0,.55); }
    .sc-badge.dist.road { background: var(--c-brand, #0a6f4d); }   /* exact road km + min */
    .sc-badge.cat { background: var(--c-accent, #bc5c00); }
    .svc-card-body { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 5px; }
    .svc-card-price { font-weight: 800; color: var(--c-brand, #0a6f4d); font-size: 1.02rem; }
    .svc-card-price small { font-weight: 600; color: var(--c-muted, #6b6960); font-size: .72rem; }
    .svc-card-title { font-weight: 700; font-size: .92rem; line-height: 1.25; }
    .svc-card-meta { font-size: .8rem; color: var(--c-muted, #6b6960); display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .svc-card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
    .svc-card-tags span { font-size: .68rem; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--c-surface-2, #f3f1ea); color: var(--c-muted, #555); }
    .svc-empty { padding: 40px 16px; text-align: center; color: var(--c-muted, #6b6960); }

    @media (max-width: 860px) {
      .svc-stage { grid-template-columns: 1fr; }
      .svc-mobile-tabs { display: flex; }
      /* compact 2-col toolbar so filters don't tower over the list */
      .svc-toolbar { grid-template-columns: 1fr 1fr; padding: 10px; gap: 7px; }
      .svc-toolbar select, .svc-toolbar input { padding: 9px 10px; font-size: 15px; }
      #filterSearch { grid-column: 1 / -1; }
      .svc-stage[data-view="list"] .svc-map-wrap { display: none; }
      .svc-stage[data-view="map"] .svc-list { display: none; }
      .svc-map-wrap { position: static; }
      .svc-map { height: 64vh; }
      .svc-list-cta { margin-left: 0; }
    }
  </style>

  <!-- Plus Jakarta Sans — the Twilight-design app typeface -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <style>
    /* ── Layout, both themes ───────────────────────────────────────────── */
    body[data-page="services"] {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; min-height: 100vh;
    }
    body[data-page="services"] .page-hero { min-height: auto !important; padding: 26px 16px 10px !important; }
    body[data-page="services"] .container { padding-bottom: 96px; }
    body[data-page="services"] #nav-slot, body[data-page="services"] #footer-slot { display: none !important; }

    /* ── Twilight dark re-skin (Claude design) for the Services directory ──
       Scoped to the dark theme: an unconditional palette on <body> beats
       css/theme-light.css on :root, because a custom property resolves to the
       nearest ancestor that sets it. Unscoped, light mode kept the whole dark
       palette. `:not([data-theme="light"])` covers the explicit dark attribute
       and the no-attribute default alike. */
    :root:not([data-theme="light"]) body[data-page="services"] {
      --c-surface: var(--surface-app); --c-surface-2: rgba(255,255,255,.05); --c-bg-elev: rgba(255,255,255,.04);
      --c-border: rgba(255,255,255,.08);
      --c-text: #E9F3EE; --c-muted: rgba(233,243,238,.55);
      --c-brand: var(--green-emerald); --c-brand-deep: var(--green-emerald); --c-accent: #F6C45A; --c-success: var(--green-emerald);
      background: radial-gradient(1100px 760px at 50% -10%, #13241D 0%, #0a120e 60%, #050806 100%);
      color: #E9F3EE;
    }
    :root:not([data-theme="light"]) body[data-page="services"] .page-hero { background: linear-gradient(180deg, #10231b, #0a120e) !important; }
    :root:not([data-theme="light"]) body[data-page="services"] .page-title { color: #fff; }
    :root:not([data-theme="light"]) body[data-page="services"] .page-subtitle { color: rgba(233,243,238,.7); }
    :root:not([data-theme="light"]) body[data-page="services"] .svc-toolbar select,
    :root:not([data-theme="light"]) body[data-page="services"] .svc-toolbar input { background: rgba(255,255,255,.05); color: #E9F3EE; border-color: rgba(255,255,255,.14); }
    :root:not([data-theme="light"]) body[data-page="services"] .svc-toolbar input::placeholder { color: rgba(233,243,238,.4); }
    :root:not([data-theme="light"]) body[data-page="services"] .svc-mobile-tabs button:not(.active) { background: rgba(255,255,255,.05); color: #E9F3EE; border-color: rgba(255,255,255,.14); }
    :root:not([data-theme="light"]) body[data-page="services"] .svc-card-photo { background: #0f1714 center/cover no-repeat; }
    /* Dark ink on the BRIGHT green/gold fills the dark palette paints. Light
       mode fills the same controls with the deep green --c-brand (#0a6f4d)
       and needs the white ink the base sheet already gives it. */
    :root:not([data-theme="light"]) body[data-page="services"] .svc-near-me,
    :root:not([data-theme="light"]) body[data-page="services"] .svc-list-cta,
    :root:not([data-theme="light"]) body[data-page="services"] .svc-mobile-tabs button.active,
    :root:not([data-theme="light"]) body[data-page="services"] .svc-chip.active,
    :root:not([data-theme="light"]) body[data-page="services"] .sca-btn.call,
    :root:not([data-theme="light"]) body[data-page="services"] .sc-badge.verified,
    :root:not([data-theme="light"]) body[data-page="services"] .sc-badge.cat,
    :root:not([data-theme="light"]) body[data-page="services"] .sc-badge.dist.road { color: #06170F; }
  </style>
  <link rel="stylesheet" href="css/theme-light.css" />
  <style>
    /* ── Text inputs in the dark theme ──────────────────────────────────────
       premium.css paints input[type="text"] (and email/tel/search/number/date/
       password) rgba(255, 255, 255, .78) with !important. That is a light
       "glass" style, and its attribute selector outranks neon-pro's plain
       `input`, so on this dark page the search and area boxes rendered as
       near-white slabs: measured alpha .78 over a dark card, which reads as a
       disabled control rather than an empty one.

       Only !important can answer !important, and this is scoped to the page
       and to non-light so the pages that are cream by design keep premium's
       fill. Light mode is left alone: there, white is correct. */
    :root:not([data-theme="light"]) body[data-page="services"] input[type="text"],
    :root:not([data-theme="light"]) body[data-page="services"] input[type="search"],
    :root:not([data-theme="light"]) body[data-page="services"] input[type="tel"],
    :root:not([data-theme="light"]) body[data-page="services"] input[type="number"],
    :root:not([data-theme="light"]) body[data-page="services"] input:not([type]) {
      background: rgba(255, 255, 255, .05) !important;
      color: var(--text) !important;
      border: 1px solid rgba(255, 255, 255, .14) !important;
    }
    :root:not([data-theme="light"]) body[data-page="services"] input::placeholder {
      color: rgba(233, 243, 238, .45) !important;
    }
  </style>
</head>
<body data-houses-pro data-page="services" data-app-shell="services.html">
  <div id="nav-slot"></div>

  <section class="page-hero" style="background-image:url('https://kkdpacoiwntrcukgwksh.supabase.co/storage/v1/object/public/site-photos/zach-rowlandson-qhK0hRwKU60-unsplash.jpg')">
    <div class="page-hero-inner">
      <!-- A decorative 60px PNG used to sit here, fetched from the storage
           bucket. It cost a request, it took 68px off the top of the one
           screen where the reader is trying to reach listings, and when the
           bucket hiccuped every visitor met a broken-image glyph as the
           first thing on the page. The title says what this is. -->
      <h1 class="page-title" data-i18n="services_title">Daily services near you</h1>
      <p class="page-subtitle" data-i18n="services_sub">Find trusted local help: cleaning, plumbing, electrical, cooking, tutoring, beauty and more. Filter by category and area, or sort by distance.</p>
    </div>
  </section>

  <main id="servicesMain" class="container" style="padding-top:18px;">

    <!-- Find-mode prompt: near me (GPS) vs a specific/far area (type it) -->
    <div class="find-mode" id="fmServices" data-near="svcNearMeBtn" data-area="filterArea" style="display:none">
      <button class="fm-x" type="button" aria-label="Dismiss">&times;</button>
      <div class="fm-q" data-i18n="fm_q_services">How do you want to find a service?</div>
      <div class="fm-actions">
        <button type="button" class="fm-btn fm-near"><span data-i18n="fm_near">Near me</span><small data-i18n="fm_near_sub_svc">Show the providers closest to me right now</small></button>
        <button type="button" class="fm-btn fm-area"><span data-i18n="fm_area">A specific area</span><small data-i18n="fm_area_sub">Type a town, district or ward, anywhere in Tanzania</small></button>
      </div>
    </div>

    <!-- One-tap category rail (synced with the Category select below) -->
    <div class="svc-chips" id="svcChips" role="tablist" aria-label="Service categories"></div>

    <div class="svc-toolbar">
      <!-- The category <select> that stood here held sixteen hardcoded English
           options and was, in its own comment, "synced with" the chip rail
           twenty pixels above it. One decision, two controls, and the two did
           not even agree on language: the chips read their labels from
           ListingKinds, so a Swahili reader saw translated chips over an
           English dropdown. The rail is the only category control now, and
           services.js keeps the value in a variable instead of in a form
           element nobody was meant to use. -->
      <input type="text" id="filterArea" list="filterAreaList" autocomplete="off"
             data-i18n-placeholder="cat_area_ph" placeholder="Area, e.g. Mikocheni, Sakina…"
             data-i18n-title="cat_area_title" title="Type any area, ward or neighbourhood" />
      <datalist id="filterAreaList"></datalist>
      <select id="filterService">
        <option value="" data-i18n="cat_cov_any">Coverage: any</option>
        <option value="within_city" data-i18n="cat_cov_city">Within city</option>
        <option value="region_wide" data-i18n="cat_cov_region">Region-wide</option>
        <option value="cross_region" data-i18n="cat_cov_cross">Cross-region</option>
      </select>
      <select id="filterRate">
        <option value="" data-i18n="sv_rate_any">Rate: any</option>
        <option value="hourly" data-i18n="sv_rate_hourly">Hourly</option>
        <option value="daily" data-i18n="sv_rate_daily">Daily</option>
        <option value="per_job" data-i18n="sv_rate_job">Per job</option>
        <option value="monthly" data-i18n="sv_rate_monthly">Monthly</option>
      </select>
      <input type="text" id="filterSearch" data-i18n-placeholder="sv_search_ph" placeholder="Search service, area or provider…" />
      <select id="svcSort" title="Sort providers">
        <option value="nearest" data-i18n="cat_sort_near">Sort: nearest</option>
        <option value="cheapest" data-i18n="cat_sort_cheap">Sort: cheapest</option>
        <option value="newest" data-i18n="cat_sort_new">Sort: newest</option>
      </select>
      <div class="svc-actions">
        <button id="svcNearMeBtn" class="svc-near-me" data-i18n-title="cat_gps_title" title="Use my GPS location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          <span data-i18n="fm_near">Near me</span>
        </button>
        <a href="agent-services.html" class="svc-list-cta"><span data-i18n="sv_cta">Offer your service</span></a>
      </div>
    </div>

    <div id="servicesCount" class="svc-result-count" role="status" aria-live="polite"></div>

    <div class="svc-mobile-tabs">
      <button id="tabList" class="active" type="button" data-i18n="xp_v_list">List</button>
      <button id="tabMap"  type="button" data-i18n="xp_v_map">Map</button>
    </div>

    <div class="svc-stage" id="servicesStage" data-view="list">
      <div id="servicesList" class="svc-list" aria-busy="true"></div>
      <div class="svc-map-wrap">
        <div id="servicesMap" class="svc-map"></div>
      </div>
    </div>

  </main>

  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9/dist/leaflet.js"></script>
  <script src="js/core/config.js"></script>
  <!-- The Mapbox token, which cannot live in a tracked file. Gitignored,
       so it 404s harmlessly on a deploy that does not ship it, leaving the
       MapTiler key from config.js to carry the map. -->
  <script src="js/config.local.js"></script>
  <script src="js/lib/geo.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/data.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/nav.js"></script>
  <script src="js/lib/geolocate.js"></script>
  <script src="js/lib/find-mode.js"></script>
  <script src="js/lib/listing-kinds.js"></script>
  <script src="js/pages/services.js"></script>
  <script>
    // Pure app-shell: in-app bottom tab bar (js/core/app-shell.js) — "Explore" tab.
    window.applyTranslations();
    window.initServicesPage();
  </script>

  <script src="js/core/app-shell.js"></script>
  <script src="js/core/sw-register.js"></script>
  <script src="js/core/premium.js" defer></script>
</body>
</html>
